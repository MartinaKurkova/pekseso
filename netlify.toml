[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run serve"
  port = 8888

[[redirects]]
  from = "/papirova_pexesa/"
  to = "/papirova-pexesa/"
  status = 301

[[redirects]]
  from = "/papirova_pexesa/*"
  to = "/papirova-pexesa/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://js.stripe.com https://widget.packeta.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src https://js.stripe.com https://b2c.cpost.cz https://widget.packeta.com https://backup.widget.packeta.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://api.stripe.com https://widget.packeta.com https://backup.widget.packeta.com; base-uri 'self'; frame-ancestors 'none'; object-src 'none'"