[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run serve"
  port = 8888

[[redirects]]
  from = "/papirova_pexesa/"
  to = "/papirova-pexesa/"
  status = 301

[[redirects]]
  from = "/papirova_pexesa/*"
  to = "/papirova-pexesa/:splat"
  status = 301